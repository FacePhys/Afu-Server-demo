# 复制为 configs/config.yaml 使用，后者不提交

server:
  addr: ":8080"
  max_body_bytes: 65536        # 请求体上限
  read_timeout: 5s
  write_timeout: 5s

db:
  dsn: "afu:afu@tcp(127.0.0.1:3306)/afu?parseTime=true&loc=UTC&charset=utf8mb4"  # 环境变量 AFU_DB_DSN 优先
  max_open_conns: 50
  max_idle_conns: 10

keys:                           # 只加载 status = active 的密钥，其余kid一律按 unknown_kid 处理
  - kid: 1
    private_key_file: "keys/kid1.pem"
    status: active

meter:                          # 原样下发给SDK；cap_runs 由 App Key 的离线可用次数决定(后台配置)
  ttl_sec: 0                    # 0 = 额度不限时
  report_sec: 60                # SDK 不用，照常下发

redis:                          # 违规次数的缓存(可选)；MySQL 是唯一准数据，Redis 不可用时直接查库
  addr: ""                      # 留空不用 Redis；环境变量 AFU_REDIS_ADDR 优先
  password: ""                  # 用环境变量 AFU_REDIS_PASSWORD，不要写在这里
  db: 0
  key_prefix: "afu:"            # 所有 key 的前缀，和共用这个 Redis 的其他服务区分

log:
  level: info

admin:                          # 内部数据后台，见 docs/internal-console.md
  addr: ""                      # 监听地址，如 "127.0.0.1:18081"，只绑内网；留空则不启动
  db_dsn: ""                    # 建议填只读账号的DSN；留空时复用 db.dsn
  tokens: []                    # 用 make admin-token 生成，按 {name, token_sha256} 填写
