services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: afu
      MYSQL_USER: afu
      MYSQL_PASSWORD: afu
    ports:
      - "${AFU_MYSQL_PORT:-3306}:3306"   # 本机3306被占用时: AFU_MYSQL_PORT=3307 make db
    volumes:
      - ./migrations:/docker-entrypoint-initdb.d:ro   # 首次启动自动建表
